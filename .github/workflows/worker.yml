name: Run-collection Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@3
      DB_NAME: imu-tracker-runs
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: '20'

      # Create the D1 database on first run, then write its id into wrangler.toml for this deploy.
      - name: Ensure D1 database
        if: steps.creds.outputs.ok == 'true'
        run: |
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create "$DB_NAME"
            id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::could not find or create D1 database $DB_NAME"; exit 1; }
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml

      - name: Apply schema migrations
        if: steps.creds.outputs.ok == 'true'
        env:
          CI: 'true'
        run: $WRANGLER d1 migrations apply "$DB_NAME" --remote

      - name: Deploy Worker
        if: steps.creds.outputs.ok == 'true'
        run: |
          $WRANGLER deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          echo "Worker URL: ${url:-see Cloudflare dashboard}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set Worker secrets
        if: steps.creds.outputs.ok == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.RUNS_ADMIN_TOKEN }}
          IP_SALT: ${{ secrets.RUNS_IP_SALT }}
          INVITE_CODE: ${{ secrets.RUNS_INVITE_CODE }}
        run: |
          [ -n "$ADMIN_TOKEN" ] && printf '%s' "$ADMIN_TOKEN" | $WRANGLER secret put ADMIN_TOKEN
          [ -n "$IP_SALT" ] && printf '%s' "$IP_SALT" | $WRANGLER secret put IP_SALT
          if [ -n "$INVITE_CODE" ]; then
            printf '%s' "$INVITE_CODE" | $WRANGLER secret put INVITE_CODE
          else
            $WRANGLER secret delete INVITE_CODE --force 2>/dev/null || true
          fi
