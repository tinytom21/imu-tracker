name = "imu-tracker-runs"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "imu-tracker-runs"
database_id = "__D1_DATABASE_ID__"   # filled in by CI from `wrangler d1 list`
migrations_dir = "migrations"

[vars]
# Pages and the Android app's WebView origin. Add the company domain here when moving.
ALLOWED_ORIGINS = "https://tinytom21.github.io,https://appassets.androidplatform.net"
MAX_UPLOAD_BYTES = "1900000"
RATE_LIMIT_PER_HOUR = "30"
# Secrets (set by CI): ADMIN_TOKEN, IP_SALT, INVITE_CODE (empty = open uploads)
